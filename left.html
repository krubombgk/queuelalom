<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เรียกคิวซักประวัติ รพ.สต.บ้านละลมพนู</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body {
    font-family:'Sarabun',sans-serif;
    background:linear-gradient(160deg,#0a2e12 0%,#1a5c2a 100%);
    display:flex;
    flex-direction:column;
    height:100vh;
    align-items:center;
    justify-content:center;
  }
  .display { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px 16px 12px; width:100%; }
  .logo { width:88px;height:88px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px;flex-shrink:0;border:4px solid #4caf50; }
  .logo img { width:80px;height:80px;object-fit:contain; }
  .hospital-name { font-weight:bold;text-align:center;line-height:1.4;margin-bottom:8px;color:#c8e6c9; }
  .divider { width:60%;height:1px;margin-bottom:10px;background:linear-gradient(90deg,transparent,#4caf50,transparent); }
  .now-label { margin-bottom:2px;text-align:center;min-height:1.3em;color:#4caf50; }
  .queue-number { font-weight:900;color:#fff;line-height:1;letter-spacing:-4px;transition:opacity 0.2s;text-align:center;font-size:160px; }
  .queue-number.flash { opacity:0; }
  .please-text { font-weight:bold;margin-top:10px;letter-spacing:0.04em;opacity:0;transition:opacity 0.3s;text-align:center;color:#a5d6a7;font-size:28px; }
  .voice-badge { font-size:11px;margin-top:8px;padding:2px 10px;border-radius:99px;opacity:0.6;background:#1b5e20;color:#a5d6a7; }
  .controls { display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 16px;flex-shrink:0;flex-wrap:wrap;width:100%;background:#061209;border-top:2px solid #2e7d32; }
  .btn { padding:11px 22px;border:none;border-radius:8px;font-size:clamp(13px,1.6vw,19px);font-family:inherit;font-weight:bold;cursor:pointer;transition:transform 0.1s,opacity 0.15s;white-space:nowrap; }
  .btn:hover   { opacity:0.85; }
  .btn:active  { transform:scale(0.96); }
  .btn:disabled { opacity:0.3;cursor:default;transform:none; }
  .btn-next   { background:#2e7d32;color:#e8f5e9;border:2px solid #4caf50;font-size:clamp(15px,1.8vw,22px);padding:13px 32px; }
  .btn-repeat { background:#1b5e20;color:#c8e6c9;border:2px solid #2e7d32; }
  .btn-back   { background:#1a2e1b;color:#81c784;border:2px solid #2e7d32; }
  .btn-reset  { background:transparent;color:#546e7a;border:1px solid #37474f;font-size:12px;padding:7px 14px; }
  .btn-key    { background:rgba(0,0,0,0.3);color:#546e7a;border:1px solid #37474f;font-size:12px;padding:7px 14px;text-decoration:none;border-radius:8px;display:inline-flex;align-items:center; }
</style>
</head>

let isOnline = navigator.onLine;
let hasThaiVoice = false;

window.addEventListener('online',  () => { isOnline=true;  updateBadge(); });
window.addEventListener('offline', () => { isOnline=false; updateBadge(); });

function getTtsKey() { try { return localStorage.getItem('googleTtsKey')||''; } catch(e){ return ''; } }

function updateBadge() {
  const key = getTtsKey();
  const txt = !isOnline ? (hasThaiVoice ? 'ออฟไลน์' : 'ออฟไลน์ (ไม่พบเสียงไทย)')
              : !key ? 'ไม่มี API Key' : 'ออนไลน์';
  document.getElementById('badge').textContent = txt;
}

function detectThaiVoice() {
  hasThaiVoice = window.speechSynthesis.getVoices().some(v=>v.lang.startsWith('th'));
  updateBadge();
}
if (window.speechSynthesis) { window.speechSynthesis.onvoiceschanged=detectThaiVoice; detectThaiVoice(); }
updateBadge();

onValue(queueRef, snap => {
  current = snap.val() || 0;
  updateDisplay(false);
});

async function writeQueue(num) { await set(queueRef, num); }

function updateDisplay(animate) {
  const qEl = document.getElementById('queue-num');
  const lEl = document.getElementById('now-label');
  const pEl = document.getElementById('please-text');
  if (current === 0) {
    qEl.textContent='-'; lEl.textContent='กรุณารอเรียกคิว'; pEl.style.opacity='0';
  } else {
    if (animate) { qEl.classList.add('flash'); setTimeout(()=>{ qEl.textContent=current; qEl.classList.remove('flash'); },200); }
    else { qEl.textContent=current; }
    lEl.textContent='คิวหมายเลข'; pEl.style.opacity='1';
  }
  document.getElementById('btn-repeat').disabled = current===0;
  document.getElementById('btn-back').disabled   = current<=1;
}

let audioUnlocked = false;
function unlockAudio() {
  if (audioUnlocked) return; audioUnlocked=true;
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const buf=ctx.createBuffer(1,1,22050); const src=ctx.createBufferSource();
    src.buffer=buf; src.connect(ctx.destination); src.start(0);
    if(ctx.state==='suspended') ctx.resume();
  } catch(e){}
}

async function speak(num) {
  unlockAudio();
  const digits = String(num).split('').join(' ');
  const text = 'ขอเรียกคิวหมายเลข ' + digits + ' กรุณาซักประวัติ';
  const key = getTtsKey();
  if (isOnline && key) {
    try {
      if (!ttsVoiceName) {
        const vr = await fetch('https://texttospeech.googleapis.com/v1/voices?languageCode=th-TH&key='+key);
        const vd = await vr.json();
        const voices = vd.voices||[];
        const f = voices.find(v=>v.ssmlGender==='FEMALE')||voices[0];
        ttsVoiceName = f ? f.name : null;
      }
      if (!ttsVoiceName) { speakOffline(text); return; }
      const r = await fetch('https://texttospeech.googleapis.com/v1/text:synthesize?key='+key, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ input:{text}, voice:{languageCode:'th-TH',name:ttsVoiceName}, audioConfig:{audioEncoding:'MP3',speakingRate:0.9} })
      });
      const d = await r.json();
      if (!d.audioContent) { speakOffline(text); return; }
      const audio = new Audio('data:audio/mp3;base64,'+d.audioContent);
      audio.play().catch(()=>speakOffline(text));
    } catch(e) { speakOffline(text); }
  } else { speakOffline(text); }
}

function speakOffline(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = window.speechSynthesis.getVoices().find(v=>v.lang.startsWith('th'));
  if(v) u.voice=v; u.lang='th-TH'; u.rate=0.82;
  window.speechSynthesis.speak(u);
}

// Event listeners แทน onclick
document.getElementById('btn-next').addEventListener('click', async () => {
  const next = current + 1;
  await writeQueue(next);
  speak(next);
});

document.getElementById('btn-back').addEventListener('click', async () => {
  if (current <= 1) return;
  const prev = current - 1;
  await writeQueue(prev);
  speak(prev);
});

document.getElementById('btn-repeat').addEventListener('click', () => {
  if (current === 0) return;
  speak(current);
});

document.getElementById('btn-reset').addEventListener('click', async () => {
  if (current > 0 && !confirm('เริ่มนับคิวใหม่?')) return;
  await writeQueue(0);
});

document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key===' ') { e.preventDefault(); document.getElementById('btn-next').click(); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); document.getElementById('btn-back').click(); }
  else if (e.key==='r'||e.key==='R') { document.getElementById('btn-repeat').click(); }
});
</script>
