<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตั้งค่า API Key</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Sarabun','TH SarabunNew',sans-serif; background:#0d1f10; color:#c8e6c9; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:#1a2e1e; border:1px solid #2e4d30; border-radius:12px; padding:28px; width:min(440px,100%); }
  h1 { font-size:20px; color:#4caf50; margin-bottom:6px; }
  .sub { font-size:13px; color:#546e7a; margin-bottom:24px; }
  label { display:block; font-size:13px; color:#81c784; margin-bottom:6px; }
  .input-row { display:flex; gap:8px; align-items:center; margin-bottom:16px; }
  input[type=password], input[type=text] {
    flex:1; padding:10px 12px; border:1px solid #2e4d30; border-radius:6px;
    background:#0d2210; color:#c8e6c9; font-family:inherit; font-size:15px;
  }
  input:focus { outline:none; border-color:#4caf50; }
  .toggle { padding:10px 12px; border:1px solid #2e4d30; border-radius:6px; background:#0d2210; color:#81c784; cursor:pointer; font-size:14px; white-space:nowrap; }
  .btn-save { width:100%; padding:13px; background:#2e7d32; color:#e8f5e9; border:none; border-radius:8px; font-size:16px; font-family:inherit; font-weight:bold; cursor:pointer; margin-top:4px; }
  .btn-save:hover { opacity:0.85; }
  .current { background:#0a2210; border:1px solid #2e4d30; border-radius:6px; padding:10px 12px; font-size:13px; color:#546e7a; margin-bottom:20px; word-break:break-all; }
  .hint { font-size:12px; color:#546e7a; margin-top:8px; }
  a { color:#4caf50; }
  .toast { display:none; background:#2e7d32; color:#e8f5e9; padding:10px 20px; border-radius:6px; text-align:center; margin-top:14px; font-weight:bold; }
  .toast.show { display:block; }
  .btn-back { display:inline-block; margin-bottom:16px; color:#4caf50; font-size:14px; text-decoration:none; background:none; border:none; cursor:pointer; font-family:inherit; padding:0; }
</style>
</head>
<body>
<div class="card">
  <a class="btn-back" href="index.html">← กลับหน้าเรียกคิว</a>
  <h1>🔑 ตั้งค่า API Key</h1>
  <p class="sub">ใส่ครั้งเดียวต่อเครื่อง เก็บในเครื่องนี้เท่านั้น</p>

  <div class="current" id="current-key">กำลังโหลด...</div>

  <label>Google Cloud API Key</label>
  <div class="input-row">
    <input type="password" id="key-input" placeholder="AIzaSy...">
    <button class="toggle" onclick="toggleShow()">👁</button>
  </div>
  <p class="hint">ยังไม่มี key? <a href="https://console.cloud.google.com/apis/credentials" target="_blank">สร้างที่ Google Cloud Console</a></p>
  <p class="hint" style="margin-top:4px;">Key นี้ใช้ได้ทั้ง Text-to-Speech และ Google Sheets</p>

  <button class="btn-save" onclick="saveKey()">💾 บันทึก</button>
  <div class="toast" id="toast">✓ บันทึกแล้ว</div>
</div>

<script>
  const inp = document.getElementById('key-input');
  const cur = document.getElementById('current-key');

  const existing = localStorage.getItem('googleTtsKey') || '';
  cur.textContent = existing ? 'Key ปัจจุบัน: ' + existing.slice(0,12) + '...' : 'ยังไม่มี Key';
  inp.value = existing;

  function toggleShow() {
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }

  function saveKey() {
    const val = inp.value.trim();
    if (!val) { alert('กรุณาใส่ API Key'); return; }
    localStorage.setItem('googleTtsKey', val);
    cur.textContent = 'Key ปัจจุบัน: ' + val.slice(0,12) + '...';
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }
</script>
</body>
</html>
